<g id="node3" class="node">
<title>struct3</title>
<polygon fill="none" stroke="black" points="107.03,-0.5 107.03,-1378.29 661.17,-1378.29 661.17,-0.5 107.03,-0.5"/>
<text xml:space="preserve" text-anchor="middle" x="131.36" y="-702" font-family="Times,serif" font-size="14.00">hello</text>
<text xml:space="preserve" text-anchor="middle" x="131.36" y="-685.2" font-family="Times,serif" font-size="14.00">world</text>
<text xml:space="preserve" text-anchor="middle" x="131.36" y="-668.4" font-family="Times,serif" font-size="14.00">and</text>
<polyline fill="none" stroke="black" points="155.69,-0.5 155.69,-1378.29"/>
<text xml:space="preserve" text-anchor="middle" x="211.12" y="-1144.69" font-family="Times,serif" font-size="14.00">Thats the reason</text>
<polyline fill="none" stroke="black" points="155.69,-919.49 266.56,-919.49"/>
<text xml:space="preserve" text-anchor="middle" x="211.12" y="-685.89" font-family="Times,serif" font-size="14.00">post&#45;menopausal</text>
<polyline fill="none" stroke="black" points="155.69,-460.69 266.56,-460.69"/>
<text xml:space="preserve" text-anchor="middle" x="211.12" y="-226.59" font-family="Times,serif" font-size="14.00">estrogen</text>
<polyline fill="none" stroke="black" points="266.56,-0.5 266.56,-1378.29"/>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1361.2" font-family="Times,serif" font-size="14.00">is</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1344.4" font-family="Times,serif" font-size="14.00">given together with another hormone called</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1327.6" font-family="Times,serif" font-size="14.00">progestin: The combination lowers the risk of</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1310.8" font-family="Times,serif" font-size="14.00">endometrial cancer.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1278" font-family="Times,serif" font-size="14.00">But the NTP advisers said putting all</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1261.2" font-family="Times,serif" font-size="14.00">estrogens on the federal list would help</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1244.4" font-family="Times,serif" font-size="14.00">women trying to balance the benefits and</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1227.6" font-family="Times,serif" font-size="14.00">risks when choosing hormone therapy.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1210.8" font-family="Times,serif" font-size="14.00">Physicians never discuss any of these risks</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1194" font-family="Times,serif" font-size="14.00">when they are prescribing hormone therapy.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1177.2" font-family="Times,serif" font-size="14.00">They only discuss benefits. Listing might</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1160.4" font-family="Times,serif" font-size="14.00">force it on the table, Michelle Medinsky, a</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1143.6" font-family="Times,serif" font-size="14.00">toxicologist from Durham, N.C., said before</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1126.8" font-family="Times,serif" font-size="14.00">the vote.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1094" font-family="Times,serif" font-size="14.00">The committee of scientists advises the NTP,</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1077.2" font-family="Times,serif" font-size="14.00">a branch of the National Institutes of Health</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1060.4" font-family="Times,serif" font-size="14.00">that every two years updates the federal list</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1043.6" font-family="Times,serif" font-size="14.00">of proven and suspected cancer&#45;causing</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-1026.8" font-family="Times,serif" font-size="14.00">substances.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-994" font-family="Times,serif" font-size="14.00">The NTP typically follows its advisers</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-977.2" font-family="Times,serif" font-size="14.00">recommendations, but an officially updated</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-960.4" font-family="Times,serif" font-size="14.00">carcinogen list isnt expected until 2002.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-927.6" font-family="Times,serif" font-size="14.00">Thursday, after a daylong debate, the panel</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-910.8" font-family="Times,serif" font-size="14.00">declined to add talc powder to the list,</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-894" font-family="Times,serif" font-size="14.00">saying there wasnt enough evidence linking</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-877.2" font-family="Times,serif" font-size="14.00">its use in feminine hygiene products to</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-860.4" font-family="Times,serif" font-size="14.00">ovarian cancer. The panel deadlocked over</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-843.6" font-family="Times,serif" font-size="14.00">whether to a second type of talc, fibrous</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-826.8" font-family="Times,serif" font-size="14.00">talc that some studies have linked to lung</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-810" font-family="Times,serif" font-size="14.00">cancer in talc miners.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-777.2" font-family="Times,serif" font-size="14.00">On Wednesday, the panel voted to add</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-760.4" font-family="Times,serif" font-size="14.00">ultraviolet radiation &#45;&#45; those</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-743.6" font-family="Times,serif" font-size="14.00">sunburn&#45;causing rays long known to cause skin</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-726.8" font-family="Times,serif" font-size="14.00">cancer &#45;&#45; to the official carcinogen list.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-694" font-family="Times,serif" font-size="14.00">The panel on Friday continued debating an</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-677.2" font-family="Times,serif" font-size="14.00">association between cancers of the nose and</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-660.4" font-family="Times,serif" font-size="14.00">sinuses with industrial exposure to wood</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-643.6" font-family="Times,serif" font-size="14.00">dust.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-610.8" font-family="Times,serif" font-size="14.00">Talc has long been controversial. When</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-594" font-family="Times,serif" font-size="14.00">studies first appeared suggesting it migrated</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-577.2" font-family="Times,serif" font-size="14.00">into the ovaries to cause tumors, many</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-560.4" font-family="Times,serif" font-size="14.00">feminine hygiene products replaced talc with</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-543.6" font-family="Times,serif" font-size="14.00">cornstarch.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-510.8" font-family="Times,serif" font-size="14.00">Panelist Medinsky said she had been prepared</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-494" font-family="Times,serif" font-size="14.00">to list talc powder as reasonably believed</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-477.2" font-family="Times,serif" font-size="14.00">to cause cancer. But after listening to</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-460.4" font-family="Times,serif" font-size="14.00">hours of industry attacks on the science,</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-443.6" font-family="Times,serif" font-size="14.00">the evidence has knocked me out of the</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-426.8" font-family="Times,serif" font-size="14.00">reasonably category into not list, she</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-410" font-family="Times,serif" font-size="14.00">said before the panel voted 7&#45;3 against</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-393.2" font-family="Times,serif" font-size="14.00">listing talc.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-360.4" font-family="Times,serif" font-size="14.00">Talc has long been controversial. When</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-343.6" font-family="Times,serif" font-size="14.00">studies first appeared suggesting it migrated</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-326.8" font-family="Times,serif" font-size="14.00">into the ovaries to cause tumors, many</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-310" font-family="Times,serif" font-size="14.00">feminine hygiene products replaced talc with</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-293.2" font-family="Times,serif" font-size="14.00">cornstarch.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-260.4" font-family="Times,serif" font-size="14.00">Panelist Medinsky said she had been prepared</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-243.6" font-family="Times,serif" font-size="14.00">to list talc powder as reasonably believed</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-226.8" font-family="Times,serif" font-size="14.00">to cause cancer. But after listening to</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-210" font-family="Times,serif" font-size="14.00">hours of industry attacks on the science,</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-193.2" font-family="Times,serif" font-size="14.00">the evidence has knocked me out of the</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-176.4" font-family="Times,serif" font-size="14.00">reasonably category into not list, she</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-159.6" font-family="Times,serif" font-size="14.00">said before the panel voted 7&#45;3 against</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-142.8" font-family="Times,serif" font-size="14.00">listing talc.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-110" font-family="Times,serif" font-size="14.00">Talc in one form or the other can be found in</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-93.2" font-family="Times,serif" font-size="14.00">many papers, paints, ceramics, food wrappers,</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-76.4" font-family="Times,serif" font-size="14.00">hard candy, chewing gum, cosmetics and pills.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-59.6" font-family="Times,serif" font-size="14.00">Most people are familiar with talc as a loose</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-42.8" font-family="Times,serif" font-size="14.00">powder used in cosmetics and as a drying</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-26" font-family="Times,serif" font-size="14.00">powder.</text>
<text xml:space="preserve" text-anchor="middle" x="407.15" y="-9.2" font-family="Times,serif" font-size="14.00">abde</text>
<polyline fill="none" stroke="black" points="547.74,-0.5 547.74,-1378.29"/>
<text xml:space="preserve" text-anchor="middle" x="581.45" y="-1144.69" font-family="Times,serif" font-size="14.00">b</text>
