[package]
name = "gv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Drop-in dot-compatible CLI and differential benchmark runner for graphvis-rs"

[[bin]]
name = "dot-rs"
path = "src/main.rs"

[[bin]]
name = "bench_phase1"
path = "src/bin/bench_phase1.rs"

[[bin]]
name = "bench_phase2"
path = "src/bin/bench_phase2.rs"

[[bin]]
name = "visual_diff"
path = "src/bin/visual_diff.rs"

[dependencies]
gv-core.workspace = true
gv-parser.workspace = true
gv-engine.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
