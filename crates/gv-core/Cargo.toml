[package]
name = "gv-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core graph arena, attributes, font metrics LUT, color tables, and primitives for graphvis-rs"

[features]
# Logs the arguments of every `math` call to `$GV_MATH_TRACE/` (see docs/porting/libm.md).
math-trace = []
# Uses the portable `math` implementations on macOS too (to check them against the corpus).
portable-math = []

[dependencies]
serde.workspace = true
thiserror.workspace = true

[lints]
workspace = true
