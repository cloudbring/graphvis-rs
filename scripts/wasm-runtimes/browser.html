<!doctype html>
<meta charset="utf-8">
<title>graphviz-pure wasm check</title>
<!-- run.mjs serves the packed package under /pkg/ and calls window.gvRender from Chrome. -->
<script type="module">
  import init, { renderAllBytes } from '/pkg/pkg/graphviz_pure_wasm.js';

  await init();
  window.gvRender = (input, engine) => Array.from(renderAllBytes(new Uint8Array(input), engine, 'svg'));
  document.title = 'ready';
</script>
