# Shared build configuration for graphviz-pure.
#
# A compiler cache helps when working in several worktrees; set it outside the repository,
# e.g. `rustc-wrapper = "sccache"` under [build] in ~/.cargo/config.toml or in a
# .cargo/config.toml in the directory that holds your worktrees.

[target.wasm32-unknown-unknown]
rustflags = ["-C", "opt-level=3"]

[profile.dev]
opt-level = 1
debug = 1

[profile.test]
opt-level = 1
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
