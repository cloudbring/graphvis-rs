[workspace]
resolver = "2"
members = [
    "crates/gv-core",
    "crates/gv-parser",
    "crates/gv-geom",
    "crates/gv-layout",
    "crates/gv-render",
    "crates/gv-engine",
    "crates/gv-wasm",
    "crates/gv-cli",
    "crates/gv-diff",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "EPL-2.0"
repository = "https://github.com/cloudbring/graphvis-rs"
authors = ["graphvis-rs contributors"]
rust-version = "1.85"

[workspace.dependencies]
gv-core = { path = "crates/gv-core", version = "0.1.0" }
gv-parser = { path = "crates/gv-parser", version = "0.1.0" }
gv-geom = { path = "crates/gv-geom", version = "0.1.0" }
gv-layout = { path = "crates/gv-layout", version = "0.1.0" }
gv-render = { path = "crates/gv-render", version = "0.1.0" }
gv-engine = { path = "crates/gv-engine", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2.100"
libm = "0.2.16"

[workspace.lints.rust]
unsafe_code = "forbid"
