# Dependency updates. Each update is a pull request that CI (tests, cargo-deny, zizmor, the
# cross-platform check) must pass. The cooldown keeps freshly published versions out for a few
# days, the window in which most malicious releases are found and yanked.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      cargo: { patterns: ["*"] }
  # The cargo-fuzz targets (fuzz/) are their own workspace, with their own Cargo.lock.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      fuzz: { patterns: ["*"] }
  # The ClusterFuzzLite build image (.clusterfuzzlite/Dockerfile), pinned by digest.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      site: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /scripts/wasm-runtimes
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      wasm-runtimes: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /scripts/c-oracle-linux
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
