name: Fuzzing

# Coverage-guided fuzzing of the cargo-fuzz targets in fuzz/ with ClusterFuzzLite
# (.clusterfuzzlite/): panics, hangs and running out of memory on crafted DOT. No C oracle; the
# differential fuzzer against C Graphviz is separate (docs/porting/fuzzing.md).
#
# - push to master: builds the targets, keeps the build, and fuzzes every target for a short
#   batch run. Pull requests are not fuzzed here: the job took 25 minutes on every push of every
#   pull request and found one crash in 141 runs, while the agents fixing bugs waited for it. A
#   crash on master opens an issue; the commits since the previous master run are the suspects.
# - schedule: a longer batch run that grows the corpus, then corpus pruning. The corpus, the
#   crashes and the builds are kept as artifacts of this workflow.
# A crash becomes an issue labelled `crash` with a minimised .gv reproducer.

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Fuzz the master build
    if: github.event_name == 'push' && github.repository == 'graphviz-pure/graphviz-pure'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # the artifacts of earlier builds and the corpus
    steps:
      - name: Build the fuzz targets and upload the build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ github.token }}
          sanitizer: address
          upload-build: true
      # Batch mode reports every crash: code-change mode would hide one that this commit's own
      # uploaded build also has.
      - name: Fuzz every target (60 s each)
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          mode: batch
          sanitizer: address
          fuzz-seconds: 600
          minimize-crashes: true

  report:
    name: Open an issue for a crash on master
    needs: build
    if: ${{ failure() && github.event_name == 'push' && github.repository == 'graphviz-pure/graphviz-pure' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write # open the issue that reports the failure
    steps:
      - name: Open the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --label bug --label crash --title "Fuzzing failed on master at ${COMMIT:0:8}" \
            --body "The post-merge fuzz run failed: $RUN_URL. The reproducer is in the run's artifacts."

  batch:
    name: Batch fuzzing and corpus pruning
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.repository == 'graphviz-pure/graphviz-pure'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read # the corpus kept by earlier runs
    steps:
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ github.token }}
          sanitizer: address
      - name: Fuzz every target (6 min each)
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          mode: batch
          sanitizer: address
          fuzz-seconds: 3600
          minimize-crashes: true
      # Batch runs only add to the corpus; pruning drops the inputs that add no coverage.
      - name: Prune the corpus
        if: ${{ !cancelled() }}
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          mode: prune
          sanitizer: address
          fuzz-seconds: 600
