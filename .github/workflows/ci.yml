name: CI

on:
  pull_request:
  push:
    branches: ["master", "opus5.5/**"]

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; master runs all complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Format, Clippy, Test & WASM Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the stable Rust toolchain (rustup is on every runner)
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Linux uses the portable math profile, so the corpus ratchets
      # (crates/gv-diff/tests/*_fidelity.rs) check tests/golden/*.portable.json.
      - name: Run Workspace Tests
        run: cargo test --workspace
      - name: Check WASM Target
        run: cargo check --target wasm32-unknown-unknown -p gv-wasm

  wasm-e2e:
    name: WASM end-to-end (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the stable Rust toolchain (rustup is on every runner)
        shell: bash
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock exactly.
      - name: Read wasm-bindgen version from Cargo.lock
        id: wb
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache wasm-bindgen-cli
        id: wb-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wb.outputs.version }}
      - name: Install wasm-bindgen-cli
        if: steps.wb-cache.outputs.cache-hit != 'true'
        env:
          WB_VERSION: ${{ steps.wb.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
      - name: Check wasm-bindgen-cli version
        env:
          WB_VERSION: ${{ steps.wb.outputs.version }}
        run: wasm-bindgen --version | grep -Fx "wasm-bindgen $WB_VERSION"
      - name: Build the wasm package
        run: |
          cargo build --release --target wasm32-unknown-unknown -p gv-wasm
          wasm-bindgen --target nodejs --out-dir "$RUNNER_TEMP/gvwasm/pkg" \
            target/wasm32-unknown-unknown/release/gv_wasm.wasm
      # Fails if a file of tests/golden/e2e-baseline.portable.json stops matching C.
      - name: Run wasm e2e against the portable baseline
        run: node scripts/wasm-e2e.mjs --pkg "$RUNNER_TEMP/gvwasm/pkg" --hashes "$RUNNER_TEMP/wasm-hashes.json"
      # wasm32 and Linux both use the portable math profile and must agree on every output,
      # matching C or not.
      - name: Compare wasm output with native Linux output
        run: |
          cargo build --release -p gv-diff
          target/release/gv-diff e2e --hashes "$RUNNER_TEMP/native-hashes.json"
          cmp "$RUNNER_TEMP/native-hashes.json" "$RUNNER_TEMP/wasm-hashes.json"

  supply-chain:
    name: Supply chain (cargo-deny, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the stable Rust toolchain (rustup is on every runner)
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Both tools are built from crates.io at a pinned version with their own lockfiles.
      - name: Cache the audit tools
        id: tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/zizmor
          key: audit-tools-${{ runner.os }}-cargo-deny-0.18.9-zizmor-1.31.1
      - name: Install cargo-deny and zizmor
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny@0.18.9 zizmor@1.31.1
      # RustSec advisories, licences (deny.toml), duplicate versions and allowed sources.
      - name: cargo deny check
        run: cargo deny check
      # Security lint of every workflow: injection, credential persistence, triggers, pinning.
      - name: zizmor
        run: zizmor --persona=pedantic --offline .github/workflows
