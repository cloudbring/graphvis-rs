name: Release

# Builds and publishes a release when a version tag (v0.1.0, ...) is pushed. Run it by hand
# (workflow_dispatch) to build and attest everything without publishing anything.
#
# Security model:
# - A release starts only from a tag on master signed with a key in .github/allowed_signers.
# - Everything is built on GitHub-hosted runners from the tagged commit, with no caches (a
#   poisoned cache cannot reach a release), `cargo build --locked` and a pinned Rust toolchain.
# - Every binary and the npm package must reproduce the gallery samples byte for byte before
#   anything is published (scripts/release-smoke.*).
# - Every artifact gets a signed build-provenance attestation (Sigstore), verifiable with
#   `gh attestation verify FILE --repo graphviz-pure/graphviz-pure`.
# - Publishing happens only in jobs bound to the `release` environment, which needs a
#   maintainer's approval and accepts only v* tags. crates.io and npm are published with
#   trusted publishing (OIDC): no registry token exists anywhere. The tokens these jobs can mint
#   live for one job. The container image is pushed to ghcr.io with the job's GITHUB_TOKEN.
# - The one stored credential is WINGET_TOKEN (a `release` environment secret), which can only
#   open a pull request to microsoft/winget-pkgs from a fork. Without it the winget job skips.
# - The Homebrew tap, the Scoop bucket and the website pull new releases themselves and verify
#   the attestations before updating; this repository holds no credential for them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The release toolchain, pinned: a new Rust release cannot change a release build silently.
  RUST_VERSION: "1.99.1"
  IMAGE: ghcr.io/graphviz-pure/graphviz-pure

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag matches the crate version and is on master
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(awk -F'"' '/^\[workspace.package\]/{p=1} p && /^version =/{print $2; exit}' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ]; then
            test "$REF_NAME" = "v$version" || { echo "::error::tag $REF_NAME but Cargo.toml says $version"; exit 1; }
            git merge-base --is-ancestor HEAD origin/master || { echo "::error::$REF_NAME is not on master"; exit 1; }
          fi
      # A maintainer's signed tag, checked against .github/allowed_signers as it is on master (not
      # as it is in the tagged commit, which the tag's author controls).
      - name: The tag is signed by a maintainer
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$REF_NAME:refs/tags/$REF_NAME"
          test "$(git cat-file -t "refs/tags/$REF_NAME")" = tag || { echo "::error::$REF_NAME is not an annotated, signed tag"; exit 1; }
          git show origin/master:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" verify-tag "$REF_NAME" \
            || { echo "::error::$REF_NAME is not signed by a key in .github/allowed_signers"; exit 1; }

  binaries:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # cargo: Apple Silicon keeps Apple's libm, which makes the output byte-identical to C on
          # macOS (measured on arm64). Apple's Intel libm is a different implementation, never
          # checked against C, and differs in the last bit (fdp-clusters moves), so the Intel build
          # uses the portable math profile, like every other platform: the same bytes everywhere.
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, cargo: "" }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, cargo: "" }
          - { target: aarch64-apple-darwin, runner: macos-15, cargo: "" }
          - { target: x86_64-apple-darwin, runner: macos-15-intel, cargo: "--features graphviz-pure-core/portable-math" }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, cargo: "" }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, cargo: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_VERSION }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          # Windows: link the C runtime statically, so the binary needs no VC++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
          CARGO_ARGS: ${{ matrix.cargo }}
        # CARGO_ARGS is deliberately unquoted: it holds zero or more cargo arguments.
        run: cargo build --release --locked --target "$TARGET" -p graphviz-pure-cli $CARGO_ARGS
      - name: Smoke test (byte-identical gallery samples)
        env:
          TARGET: ${{ matrix.target }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          exe=target/$TARGET/release/graphviz-pure
          case "$TARGET" in *windows*) exe=$exe.exe ;; esac
          "$PYTHON" scripts/release-smoke.py "$exe"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          "$PYTHON" scripts/release-package.py "$TARGET" "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  npm-package:
    name: Build the npm package
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no caches in a release
      # wasm-bindgen-cli is built from crates.io at exactly the version in Cargo.lock. No
      # wasm-opt: Ubuntu's binaryen (108) breaks the module's function table, and the build
      # already optimizes for size (opt-level z, fat LTO).
      - name: Install wasm-bindgen-cli
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install --locked wasm-bindgen-cli --version "$v"
      - name: Build
        working-directory: web
        run: npm run build:wasm
      - name: Smoke test (byte-identical gallery samples)
        run: node scripts/release-smoke-wasm.mjs
      - name: Check the package versions (npm and JSR)
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          test "$(node -p "require('./web/package.json').version")" = "$VERSION"
          test "$(node -p "require('./jsr.json').version")" = "$VERSION"
      - name: Pack
        working-directory: web
        run: mkdir -p ../dist && npm pack --pack-destination ../dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: dist/
          if-no-files-found: error

  # The container image is assembled from the two musl archives above (no second compile) with
  # the docker and buildx already on the runner: the organization allows no docker/* actions.
  image:
    name: Build the container image
    needs: [check, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*-unknown-linux-musl
          path: dist
          merge-multiple: true
      - name: Use the containerd image store (multi-platform builds)
        # Merged into the runner's daemon.json, which holds settings of its own.
        run: |
          sudo mkdir -p /etc/docker
          test -s /etc/docker/daemon.json || echo '{}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo python3 - <<'EOF'
          import json
          p = "/etc/docker/daemon.json"
          c = json.load(open(p))
          c.setdefault("features", {})["containerd-snapshotter"] = True
          json.dump(c, open(p, "w"))
          EOF
          sudo systemctl restart docker
          docker info -f '{{.DriverStatus}}' | grep -q io.containerd.snapshotter
      - name: Build
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          scripts/release-image.sh "$VERSION" dist image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image/
          if-no-files-found: error

  # The image must reproduce the gallery samples byte for byte on each platform, like the
  # binaries: release-smoke.py runs it through a wrapper that mounts the checkout read-only.
  image-smoke:
    name: Smoke test the image (${{ matrix.platform }})
    needs: [check, image]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: image
      - name: Use the containerd image store (multi-platform images)
        # As in the image job.
        run: |
          sudo mkdir -p /etc/docker
          test -s /etc/docker/daemon.json || echo '{}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo python3 - <<'EOF'
          import json
          p = "/etc/docker/daemon.json"
          c = json.load(open(p))
          c.setdefault("features", {})["containerd-snapshotter"] = True
          json.dump(c, open(p, "w"))
          EOF
          sudo systemctl restart docker
          docker info -f '{{.DriverStatus}}' | grep -q io.containerd.snapshotter
      - name: Load
        run: docker load --input image/graphviz-pure-image.tar
      - name: Smoke test (byte-identical gallery samples)
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/graphviz-pure" <<EOF
          #!/bin/sh
          exec docker run --rm --network none --platform $PLATFORM -v "$PWD:$PWD:ro" $IMAGE:$VERSION "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/graphviz-pure"
          python3 scripts/release-smoke.py "$RUNNER_TEMP/graphviz-pure"

  attest:
    name: Checksums and provenance
    needs: [binaries, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation in this repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  github-release:
    name: Publish the GitHub release
    if: github.event_name == 'push'
    needs: [check, attest]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          graphviz-pure $VERSION, a pure-Rust port of Graphviz 16.1.0 with the same output on every platform.

          Every file below was built by GitHub Actions from \`$TAG\` and has a signed build-provenance attestation. Verify a download with:

          \`\`\`sh
          gh attestation verify FILE --repo $REPO
          sha256sum --check --ignore-missing SHA256SUMS
          \`\`\`
          EOF
          # Releases are immutable once published, so every file is attached to a draft first.
          gh release create "$TAG" --repo "$REPO" --verify-tag --draft --title "graphviz-pure $VERSION" --notes-file notes.md dist/*
          gh release edit "$TAG" --repo "$REPO" --draft=false

  crates-io:
    name: Publish to crates.io
    if: github.event_name == 'push'
    needs: github-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing: exchange the OIDC token for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # Publishes the eight published crates in dependency order (the others have publish = false).
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --workspace

  npm:
    name: Publish to npm
    if: github.event_name == 'push'
    needs: github-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing; npm adds provenance from the same token
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm 11, which supports trusted publishing
          package-manager-cache: false # no caches in a release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist
      # The tarball the attest job signed is the one staged. The trusted publisher may only stage:
      # the version goes live when a maintainer approves it on npmjs.com with 2FA.
      - name: npm stage publish
        run: npm stage publish --access public dist/*.tgz

  # The same attested npm tarball, published to JSR with tokenless OIDC. JSR has no staging, so
  # the `release` environment's approval is the only gate before the version goes live.
  jsr:
    name: Publish to JSR
    if: github.event_name == 'push'
    needs: github-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # JSR's GitHub Actions OIDC publishing; JSR adds provenance from it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no caches in a release
      - name: jsr.json matches the tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          v=$(node -p "require('./jsr.json').version")
          test "v$v" = "$REF_NAME" || { echo "::error::tag $REF_NAME but jsr.json says $v"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist
      # jsr.json publishes web/pkg/*, which the npm tarball holds as package/pkg/*. web/pkg is
      # gitignored, so the checkout stays clean for `jsr publish`.
      - name: Unpack the npm package
        run: tar -xzf dist/*.tgz -C web --strip-components=1 package/pkg
      # jsr pinned exactly; it downloads the Deno release it is built for and checks its SHA-256.
      - name: jsr publish
        run: npx --yes jsr@0.14.3 publish

  ghcr:
    name: Publish the container image
    if: github.event_name == 'push'
    needs: [check, image-smoke, github-release]
    runs-on: ubuntu-24.04 # has skopeo
    environment: release
    permissions:
      packages: write # push to ghcr.io/graphviz-pure/graphviz-pure
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation in this repository
      artifact-metadata: write # record where the attested image is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: image
      # skopeo copies the smoke-tested OCI layout as it is, so every tag gets the digest the
      # image job computed. Tags: 0.1.0, 0.1 and latest; a pre-release (0.2.0-rc.1) only its own.
      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          digest=$(cat image/graphviz-pure-image.digest)
          tags=$VERSION
          case "$VERSION" in *-*) ;; *) tags="$VERSION ${VERSION%.*} latest" ;; esac
          printenv GH_TOKEN | skopeo login --authfile "$RUNNER_TEMP/auth.json" --username "$ACTOR" --password-stdin ghcr.io
          for tag in $tags; do
            skopeo copy --all --preserve-digests --authfile "$RUNNER_TEMP/auth.json" --digestfile "$RUNNER_TEMP/pushed" \
              oci-archive:image/graphviz-pure-image.tar "docker://$IMAGE:$tag"
            test "$(cat "$RUNNER_TEMP/pushed")" = "$digest" || { echo "::error::$IMAGE:$tag was pushed as $(cat "$RUNNER_TEMP/pushed"), not $digest"; exit 1; }
          done
          rm "$RUNNER_TEMP/auth.json"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The attestation is pushed next to the image, so `gh attestation verify oci://...` and
      # registry-side policy tools find it. That push reads Docker's credentials.
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printenv GH_TOKEN | docker login ghcr.io --username "$ACTOR" --password-stdin
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  # Opens the pull request to microsoft/winget-pkgs for the new version. komac reads the
  # previous version's manifest and analyses both zips, which hold one portable exe each, so
  # the nested installer entries (including the versioned directory) are filled in by it. The
  # package's first version is submitted by hand (docs/releasing.md).
  winget:
    name: Open the winget update
    if: github.event_name == 'push'
    needs: [check, github-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions: {} # komac uses WINGET_TOKEN only, against its owner's winget-pkgs fork
    env:
      KOMAC_VERSION: "2.17.1"
      # komac-2.17.1-x86_64-unknown-linux-gnu.tar.gz, as listed in that release's SHA256SUMS.
      KOMAC_SHA256: e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7
    steps:
      - name: Check for WINGET_TOKEN
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WINGET_TOKEN is not set in the release environment, so no winget pull request was opened (docs/releasing.md)"
          fi
      - name: Install komac ${{ env.KOMAC_VERSION }}
        if: steps.token.outputs.set == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --output komac.tar.gz \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$KOMAC_SHA256  komac.tar.gz" | sha256sum --check --strict
          tar -xzf komac.tar.gz komac
      - name: komac update
        if: steps.token.outputs.set == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        # In CI komac exits quietly if a pull request for this version already exists, so a
        # re-run does not open a second one.
        run: |
          base="https://github.com/$REPO/releases/download/$TAG"
          "$RUNNER_TEMP/komac" update GraphvizPure.GraphvizPure --version "$VERSION" \
            --urls "$base/graphviz-pure-$VERSION-x86_64-pc-windows-msvc.zip" "$base/graphviz-pure-$VERSION-aarch64-pc-windows-msvc.zip" \
            --release-notes-url "https://github.com/$REPO/releases/tag/$TAG" \
            --submit
